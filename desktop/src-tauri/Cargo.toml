[package]
name = "job-matcher"
version = "0.1.0"
description = "Desktop shell for Job Matcher: starts the local API and UI and shows them in a window"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde_json = "1"

[profile.release]
strip = true
